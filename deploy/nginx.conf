# Production-like load-test proxy (P14-T04).
#
# Four Next instances share one upstream. Anonymous HTML is cached for five seconds; any request
# carrying a session or guest-cart cookie bypasses the cache, as do RSC prefetch requests. This is
# the shape a CDN/reverse proxy would provide in production and is what makes §13.6 reachable
# without changing application semantics.

worker_processes auto;

events {
  worker_connections 4096;
}

http {
  include /etc/nginx/mime.types;
  default_type application/octet-stream;
  sendfile on;
  keepalive_timeout 65;
  gzip on;
  gzip_types text/css application/javascript application/json image/svg+xml;

  proxy_cache_path /var/cache/nginx levels=1:2 keys_zone=midad:100m
    inactive=60s max_size=1g use_temp_path=off;

  upstream midad_upstream {
    least_conn;
    server web1:3000 max_fails=2 fail_timeout=10s;
    server web2:3000 max_fails=2 fail_timeout=10s;
    server web3:3000 max_fails=2 fail_timeout=10s;
    server web4:3000 max_fails=2 fail_timeout=10s;
    server web5:3000 max_fails=2 fail_timeout=10s;
    server web6:3000 max_fails=2 fail_timeout=10s;
    server web7:3000 max_fails=2 fail_timeout=10s;
    server web8:3000 max_fails=2 fail_timeout=10s;
    keepalive 64;
  }

  server {
    listen 8080;
    server_name _;
    client_max_body_size 8m;

    proxy_http_version 1.1;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_set_header Connection "";

    location /_next/static/ {
      proxy_pass http://midad_upstream;
      proxy_cache midad;
      proxy_cache_valid 200 1h;
      add_header X-Cache-Status $upstream_cache_status;
    }

    location /api/ {
      proxy_pass http://midad_upstream;
      proxy_cache_bypass 1;
      proxy_no_cache 1;
    }

    location / {
      set $bypass 0;
      if ($request_method !~ ^(GET|HEAD)$) {
        set $bypass 1;
      }
      if ($http_rsc != "") {
        set $bypass 1;
      }
      if ($http_next_router_prefetch != "") {
        set $bypass 1;
      }

      proxy_pass http://midad_upstream;
      # Next marks dynamic HTML private and sets the locale cookie; for anonymous, cacheable pages
      # the proxy owns those headers. Cookies that identify a session/cart already bypass the cache.
      proxy_ignore_headers Cache-Control Expires Set-Cookie;
      proxy_cache midad;
      proxy_cache_key "$scheme$request_method$host$request_uri|$http_cookie";
      proxy_cache_valid 200 60s;
      proxy_cache_lock on;
      proxy_cache_background_update on;
      proxy_cache_use_stale updating error timeout http_500 http_502 http_503 http_504;
      proxy_cache_bypass $bypass;
      proxy_no_cache $bypass;
      add_header X-Cache-Status $upstream_cache_status always;
    }
  }
}
